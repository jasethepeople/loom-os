[package]
name = "core"
version = "0.2.0"
edition = "2021"
authors = ["Loom OS Contributors"]
description = "Loom OS Kernel — Async orchestrator for LLM, GPU, and Wasm plugins"
license = "MIT OR Apache-2.0"

[dependencies]
shared = { path = "../shared" }
tokio = { workspace = true }
tokio-util = "0.7"
wasmtime = "18.0"
wasmtime-wasi = "18.0"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dashmap = "5.5"
parking_lot = "0.12"
anyhow = { workspace = true }
thiserror = { workspace = true }

# IPC
nng = "1.0"

# LLM
candle-core = { version = "0.8", features = ["cuda"] }
candle-transformers = "0.8"
candle-nn = "0.8"
tokenizers = "0.21"
hf-hub = "0.3"
rand = "0.8"

# GPU
wgpu = { version = "22.0", features = ["spirv"] }
pollster = "0.4"
bytemuck = { version = "1.14", features = ["derive"] }

# Config
toml = "0.8"
